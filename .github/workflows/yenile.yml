name: Veriyi yenile ve yayınla

on:
  schedule:
    # Her gün 08:17, 14:17 ve 18:17 (Türkiye saati); zamanlar UTC yazılır
    - cron: "17 5,11,15 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Veriyi indir ve sayfayı üret
        run: python3 web_olustur.py --tam site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: yayin
        uses: actions/deploy-pages@v4
