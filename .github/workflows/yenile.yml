name: Veriyi yenile ve yayınla

# Sayfa GitHub Pages'te "Deploy from a branch" (main, kök klasör) ayarıyla yayınlanır:
# bu iş akışı index.html'i yeniden üretip main dalına işler, Pages de onu yayınlar.
on:
  schedule:
    # İki saatte bir, 08:17 - 00:17 arası (Türkiye saati); zamanlar UTC yazılır
    - cron: "17 5-21/2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [index.html]

permissions:
  contents: write

concurrency:
  group: yenile
  cancel-in-progress: false

jobs:
  yenile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Veriyi indir ve sayfayı üret
        run: python3 web_olustur.py --tam index.html
      - name: Sayfayı depoya işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
          else
            git commit -m "Veri yenilemesi $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
